name: Conversoes Reais (Salesforce)

# Reconstroi a origem real das vendas cruzando cada Opportunity com a base de
# leads por telefone e email. Semanal: a extracao baixa ~750 mil leads (uns 10
# min de runner) e o painel e de leitura estrategica, nao operacional.

on:
  schedule:
    - cron: "0 9 * * 1" # segunda 06:00 BRT
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# grupo proprio: no grupo "pages" o deploy de push cancelaria este refresh
concurrency:
  group: conversoes-reais
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pipeline (extrai, cruza, agrega, gera)
        env:
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          SF_REFRESH_TOKEN: ${{ secrets.SF_REFRESH_TOKEN }}
          SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
          SF_LOGIN_URL: ${{ secrets.SF_LOGIN_URL }}
        run: python3 conversoes-reais/run.py --repo .

      - name: Commita o painel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/conversoes-reais
          git diff --staged --quiet || \
            git commit -m "conversoes reais: refresh $(date -u +%Y-%m-%d) [skip ci]"
          git push

      # deploy no MESMO job: o push do GITHUB_TOKEN nao redispara workflow
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
